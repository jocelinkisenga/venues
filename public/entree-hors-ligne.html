<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrée hors ligne</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f59e0b">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f8fafc; color: #0f172a; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px #0001; }
  input, button { font-size: 18px; padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1; width: 100%; box-sizing: border-box; margin-top: 8px; }
  button { background: #f59e0b; color: #fff; border: 0; font-weight: 600; }
  button.secondary { background: #64748b; }
  .ok { background: #059669; color: #fff; }
  .ko { background: #dc2626; color: #fff; }
  .muted { font-size: 13px; color: #64748b; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="setup" class="card hidden">
  <h2>Configuration de l'appareil</h2>
  <input id="token" placeholder="Jeton API (guests:read, checkins:write)" autocomplete="off">
  <input id="bookingId" placeholder="Numéro de réservation (ID)" inputmode="numeric">
  <button id="saveSetup">Enregistrer</button>
  <p class="muted">Le jeton reste sur cet appareil. Utilisez un appareil dédié à l'entrée et révoquez le jeton en fin d'événement.</p>
</div>

<div id="main" class="card hidden">
  <h2 id="title"></h2>
  <p class="muted" id="connection"></p>
  <form id="scanForm">
    <input id="code" autocomplete="off" placeholder="Scanner ou saisir le code du billet" autofocus>
    <button>Valider l'entrée</button>
  </form>
  <div id="feedback" class="card hidden"></div>
  <p class="muted"><span id="admitted">0</span> entrée(s) · <span id="queued">0</span> en attente d'envoi</p>
  <button id="refresh" class="secondary">Mettre à jour la liste des invités</button>
  <button id="reset" class="secondary">Changer de réservation / effacer</button>
</div>

<script>
const DB_NAME = 'entree';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore('guests', { keyPath: 'token' });
      req.result.createObjectStore('queue', { keyPath: 'client_id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function run(store, mode, make) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const req = make(t.objectStore(store));
    t.oncomplete = () => resolve(req ? req.result : undefined);
    t.onerror = () => reject(t.error);
  });
}
const all = (s) => run(s, 'readonly', (os) => os.getAll());
const get = (s, k) => run(s, 'readonly', (os) => os.get(k));
const put = (s, v) => run(s, 'readwrite', (os) => os.put(v));
const del = (s, k) => run(s, 'readwrite', (os) => os.delete(k));
const clearAll = async () => { await run('guests', 'readwrite', (os) => os.clear()); await run('queue', 'readwrite', (os) => os.clear()); };

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

let cfg = JSON.parse(localStorage.getItem('cfg') || 'null');
let syncing = false;

function show(type, text) {
  const el = document.getElementById('feedback');
  el.className = 'card ' + (type === 'ok' ? 'ok' : 'ko');
  el.textContent = text;
  el.classList.remove('hidden');
  clearTimeout(show.timer);
  show.timer = setTimeout(() => el.classList.add('hidden'), 4000);
}

async function updateCounts() {
  const guests = await all('guests');
  const queue = await all('queue');
  document.getElementById('admitted').textContent = guests.filter((g) => g.attended_at).length;
  document.getElementById('queued').textContent = queue.length;
  document.getElementById('connection').textContent = navigator.onLine ? 'Connecté' : 'Hors ligne : les entrées sont enregistrées localement';
}

async function refreshGuests() {
  const res = await fetch(`/api/v1/bookings/${cfg.bookingId}/guests`, {
    headers: { Accept: 'application/json', Authorization: 'Bearer ' + cfg.token },
  });
  if (!res.ok) throw new Error('Erreur ' + res.status + ' : vérifiez le jeton et le numéro de réservation.');
  const { data } = await res.json();
  await clearAll();
  for (const g of data) await put('guests', g);
  await updateCounts();
}

async function scan(code) {
  code = code.trim();
  if (!code) return;

  const guest = await get('guests', code);

  if (!guest) return show('ko', 'Code inconnu sur cet appareil. Mettez la liste à jour si vous êtes en ligne.');
  if (guest.rsvp_status !== 'confirmed') return show('ko', guest.full_name + " : présence non confirmée");
  if (guest.attended_at) return show('ko', guest.full_name + ' : déjà entré');

  const scannedAt = new Date().toISOString();
  guest.attended_at = scannedAt;
  await put('guests', guest);
  await put('queue', { client_id: uuid(), token: code, scanned_at: scannedAt });

  show('ok', guest.full_name + (guest.companions ? ` (+${guest.companions})` : '') + ' : entrée validée');
  await updateCounts();
  sync();
}

async function sync() {
  if (syncing || !navigator.onLine || !cfg) return;
  const queue = await all('queue');
  if (!queue.length) return updateCounts();

  syncing = true;
  try {
    const res = await fetch('/api/v1/checkins/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json', Authorization: 'Bearer ' + cfg.token },
      body: JSON.stringify({
        booking_id: Number(cfg.bookingId),
        scans: queue.map(({ client_id, token, scanned_at }) => ({ client_id, token, scanned_at })),
      }),
    });
    if (res.ok) {
      const { results } = await res.json();
      for (const item of queue) {
        if (results[item.client_id]) await del('queue', item.client_id);
      }
    }
    // En cas d'erreur réseau ou serveur, la file reste intacte et sera renvoyée plus tard
  } catch (e) {
    // hors ligne en cours d'envoi : rien à faire
  } finally {
    syncing = false;
    await updateCounts();
  }
}

function showMain() {
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('title').textContent = 'Réservation #' + cfg.bookingId;
  document.getElementById('code').focus();
}

document.getElementById('saveSetup').onclick = async () => {
  cfg = {
    token: document.getElementById('token').value.trim(),
    bookingId: document.getElementById('bookingId').value.trim(),
  };
  if (!cfg.token || !cfg.bookingId) return alert('Renseignez le jeton et le numéro de réservation.');
  localStorage.setItem('cfg', JSON.stringify(cfg));
  showMain();
  try { await refreshGuests(); } catch (e) { alert(e.message); }
};

document.getElementById('scanForm').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('code');
  scan(input.value).finally(() => { input.value = ''; input.focus(); });
};

document.getElementById('refresh').onclick = async () => {
  try { await refreshGuests(); show('ok', 'Liste mise à jour.'); await sync(); }
  catch (e) { show('ko', e.message); }
};

document.getElementById('reset').onclick = async () => {
  if (!confirm('Effacer la réservation et les données locales de cet appareil ?')) return;
  await clearAll();
  localStorage.removeItem('cfg');
  location.reload();
};

window.addEventListener('online', () => { updateCounts(); sync(); });
setInterval(sync, 30000);

if (cfg) {
  showMain();
  updateCounts();
  sync();
} else {
  document.getElementById('setup').classList.remove('hidden');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
